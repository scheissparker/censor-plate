services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ORT_THREADS: "2"
      MAX_IMAGE_PIXELS: "40000000"
    volumes:
      - ./models:/app/models:ro
      - plate_tmp:/tmp
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 128
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  plate_tmp:
